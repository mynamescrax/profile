            height: 20px;

            right: -2px;

        .orbit-line {

            left: -7px;

            border-radius: 2px;
            background: #fff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);

            width: 24px;

        .profile-picture {

            height: 150px;

            z-index: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            gap: 10px;
            margin-bottom: 10px;

        .status-dot {

            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 6px currentColor;

        .status-dot.idle    { background: #faa81a; color: #faa81a; }
        .status-dot.dnd     { background: #ed4245; color: #ed4245; }
        .status-dot.offline { background: #747f8d; color: #747f8d; box-shadow: none; }

            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 10px;
            opacity: 1 !important;
        }

        .bio-separator {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 20px 0;
            opacity: 1 !important;
        }

        .profile-footer {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            margin-top: auto;
        }

        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            align-self: flex-start;
            position: relative;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .visitor-icon {
            width: 18px;
            height: 18px;
            color: white;
            opacity: 1 !important;
        }

        .visitor-counter .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            top: -35px;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .visitor-counter:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        #visitor-count {
            opacity: 1 !important;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 0;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon:hover {
            transform: scale(1.4) rotateY(15deg);
        }

        .glitch {
            animation: glitch 0.2s ease-in-out;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
            100% {
                transform: translate(0);
            }
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);

            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;

        #start-text {

            font-size: 24px;
            color: #fff;
            text-align: center;

            gap: 14px;

            color: white;

            height: 42px;
            border-radius: 8px;
            flex-shrink: 0;
            overflow: hidden;
        }

            flex: 1;
            display: flex;
            align-items: center;

            border-radius: 3px;
            outline: none;
            cursor: pointer;

            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        #music-progress::-moz-range-thumb {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            width: 20px;
            height: 20px;
            cursor: pointer;
            color: white;
            flex-shrink: 0;
            transition: opacity 0.15s;
        }

        .ctrl-play {
            width: 26px;
            height: 26px;
        }

        .ctrl-btn:hover {
            opacity: 0.6;
        }

            position: absolute;

            align-items: center;

        .scroll-mouse {
            width: 24px;
            height: 38px;
            border: 2px solid rgba(255, 255, 255, 0.7);

        }

        .scroll-mouse::after {
            content: '';
            position: absolute;
            top: 7px;
            left: 50%;
            width: 4px;
            height: 8px;
            margin-left: -2px;
            border-radius: 2px;
            background: #fff;
            animation: scroll-wheel 1.6s ease-in-out infinite;

        .scroll-text {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.6);
        }

        @keyframes scroll-wheel {
            0% { transform: translateY(0); opacity: 1; }
            70% { transform: translateY(14px); opacity: 0; }
            100% { transform: translateY(0); opacity: 0; }
        }

        #projects {

        .section-heading {
            font-family: 'Courier New', monospace;
            font-size: 15px;

            text-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }

        .section-heading::after {
            content: '';
            display: block;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 12px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .project-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
        }

        .project-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .project-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            flex-shrink: 0;
        }

        .project-title {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
        }

        .project-desc {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.7);
            flex: 1;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .project-tags span {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1px;
        }

        @media (max-width: 760px) {
            html {
                scroll-snap-type: y proximity;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .scroll-indicator {
                bottom: 20px;
            }

            #projects {
                padding: 40px 20px;
            }
        }
    </style>
